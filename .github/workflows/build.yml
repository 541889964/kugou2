name: Build APK
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.27.1', channel: 'stable', cache: true}

      - name: 备份 pubspec + assets
        run: |
          cp pubspec.yaml /tmp/ours-pubspec.yaml
          cp -r assets /tmp/ours-assets || true

      - run: flutter create --org com.kugou --project-name kugou --platforms=android .

      - name: 恢复 pubspec + assets
        run: |
          cp /tmp/ours-pubspec.yaml pubspec.yaml
          rm -rf assets
          cp -r /tmp/ours-assets assets
          grep -A6 "assets:" pubspec.yaml
          ls -lh assets/

      - name: 清缓存
        run: |
          flutter clean || true
          rm -rf .dart_tool build

      - run: cp android_manifest.xml android/app/src/main/AndroidManifest.xml

      - name: 覆盖 MainActivity.kt
        run: |
          mkdir -p android/app/src/main/kotlin/com/kugou/kugou
          cp android_native/MainActivity.kt android/app/src/main/kotlin/com/kugou/kugou/MainActivity.kt

      - run: flutter pub get
      - name: Build
        run: flutter build apk --release

      - name: 定位 APK
        run: |
          APK=$(find build -name "app-release.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(find build -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && exit 1
          mkdir -p out && cp "$APK" out/KuGou.apk
          ls -lh out/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KuGou #${{ github.run_number }}
          files: out/KuGou.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
