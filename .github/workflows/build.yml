name: Build
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions:
  contents: write
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查 backend-runtime-v1
        id: check
        run: |
          if curl -sfI "https://github.com/541889964/kugou2/releases/download/backend-runtime-v1/node-arm64.tar.gz" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: 下载 Termux Node arm64
        if: steps.check.outputs.exists == 'false'
        run: |
          curl -fL --retry 3 -o /tmp/Packages.gz https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages.gz
          gunzip -f /tmp/Packages
          FILEPATH=$(awk '/^Package: nodejs-lts$/{f=1} f&&/^Filename:/{print $2; exit}' /tmp/Packages)
          test -n "$FILEPATH"
          curl -fL --retry 3 -o /tmp/node.deb "https://packages.termux.dev/apt/termux-main/$FILEPATH"
          mkdir -p /tmp/nodex && dpkg-deb -x /tmp/node.deb /tmp/nodex
      - name: 下载 KuGouMusicApi + npm install
        if: steps.check.outputs.exists == 'false'
        run: |
          curl -fL --retry 3 -o /tmp/kg.zip "https://gh-proxy.com/https://github.com/MakcRe/KuGouMusicApi/archive/refs/heads/main.zip" \
            || curl -fL --retry 3 -o /tmp/kg.zip "https://github.com/MakcRe/KuGouMusicApi/archive/refs/heads/main.zip"
          unzip -q /tmp/kg.zip -d /tmp/kg
          mkdir -p /tmp/embed/backend
          cp -r /tmp/kg/KuGouMusicApi-main/* /tmp/embed/backend/
          rm -rf /tmp/embed/backend/.git /tmp/embed/backend/.github || true
          cd /tmp/embed/backend
          npm config set registry https://registry.npmmirror.com
          npm install --production --no-audit --no-fund 2>&1 | tail -3
      - name: 打包 tar
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p /tmp/embed/node
          cp -r /tmp/nodex/data/data/com.termux/files/usr/bin /tmp/embed/node/
          cp -r /tmp/nodex/data/data/com.termux/files/usr/lib /tmp/embed/node/
          cd /tmp/embed/node
          find lib -name "*.so*" ! \( -name "libc++*" -o -name "libssl*" -o -name "libcrypto*" -o -name "libz*" -o -name "libicu*" \) -delete || true
          cd /tmp/embed
          tar --format=ustar -czf node-arm64.tar.gz node
          tar --format=ustar -czf backend.tar.gz -C backend .
          ls -lh *.tar.gz
      - name: 上传 tar（仅首次）
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backend-runtime-v1
          name: Backend Runtime v1
          body: "Node arm64 + KuGouMusicApi"
          files: |
            node-arm64.tar.gz
            backend.tar.gz
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.27.1', channel: 'stable', cache: true}
      - run: |
          cp pubspec.yaml /tmp/ours-pubspec.yaml
          cp -r assets /tmp/ours-assets || true
      - run: flutter create --org com.kugou --project-name kugou --platforms=android .
      - run: |
          cp /tmp/ours-pubspec.yaml pubspec.yaml
          rm -rf assets && cp -r /tmp/ours-assets assets
      - run: |
          flutter clean || true
          rm -rf .dart_tool build
      - run: cp android_manifest.xml android/app/src/main/AndroidManifest.xml
      - run: |
          mkdir -p android/app/src/main/kotlin/com/kugou/kugou
          cp android_native/MainActivity.kt android/app/src/main/kotlin/com/kugou/kugou/MainActivity.kt
      - run: flutter pub get
      - run: flutter build apk --release
      - run: |
          APK=$(find build -name "app-release.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(find build -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && exit 1
          mkdir -p out && cp "$APK" out/KuGou.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KuGou #${{ github.run_number }}
          files: out/KuGou.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
