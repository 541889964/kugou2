name: Build APK
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.27.1', channel: 'stable', cache: true}
      - run: flutter create --org com.kugou --project-name kugou --platforms=android .
      - name: Force pubspec
        run: |
          cp ci-pubspec.yaml pubspec.yaml
          echo "=== pubspec assets ==="
          grep -A3 "assets:" pubspec.yaml
          echo "=== wallpaper 文件 ==="
          ls -lh assets/wallpaper.jpg
      - run: cp android_manifest.xml android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Build
        id: b
        continue-on-error: true
        run: flutter build apk --release 2>&1 | tee /tmp/build.log
      - if: steps.b.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with: {name: build-error-log, path: /tmp/build.log}
      - if: steps.b.outcome == 'failure'
        run: exit 1
      - name: Find APK
        run: |
          find . -name "*.apk" -type f 2>/dev/null
          APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          [ -z "$APK" ] && exit 1
          mkdir -p out && cp "$APK" out/KuGou.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KuGou #${{ github.run_number }}
          files: out/KuGou.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
