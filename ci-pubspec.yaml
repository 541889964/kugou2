name: kugou
description: KuGou Music Pro
publish_to: 'none'
version: 30.0.0+30
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter: {sdk: flutter}
  dio: ^5.4.0
  crypto: ^3.0.3
  just_audio: ^0.9.36
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  path_provider: ^2.1.2
  http: ^1.2.0
  permission_handler: ^11.3.1
  file_picker: ^8.0.6
  flutter_overlay_window: ^0.5.0
  url_launcher: ^6.2.6
  android_intent_plus: ^4.0.1
  archive: ^3.6.1
  path: ^1.9.0
  home_widget: ^0.6.0
dev_dependencies:
  flutter_test: {sdk: flutter}
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/signature.json
    - assets/wallpaper.jpg
    - assets/wallpapers/
    - assets/icons/
